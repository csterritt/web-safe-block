[package]
name = "web-safe-block"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["form"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "server", "server-graceful", "service", "tokio"] }
rand = "0.10.3"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6"
tokio = { version = "1.54.1", features = ["io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
