<!doctype html>
<meta charset="utf-8">
<title>web-safe-block Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
.pkt>.lbl{visibility:hidden}
.pkt:hover>.lbl,.pkt.lbl-on>.lbl{visibility:visible}
.node>.hl{visibility:hidden}
.node:hover>.hl,.node.sel>.hl,.node.hov>.hl{visibility:visible}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"edge","title":"The edge"},{"id":"gate","title":"The gate"},{"id":"relay","title":"Through to the app"},{"id":"ops","title":"Operating it"},{"id":"off","title":"Not switched on"}];
const NODES = [{"id":"BR","code":"B","name":"Visitor's browser","short":"BROWSER","group":"edge","gx":0,"gy":6,"w":2,"d":2,"h":26,"kind":"screen","one":"A person with a browser, outside, who wants in.","what":"Anyone on the internet. They see exactly two things from web-safe-block itself: the phrase form, and — once they are in — whatever the protected app serves.","how":"All it ever needs to send is a <code>POST /__wsb/login</code> with <code>user</code> and <code>phrase</code> fields, then carry the <code>wsb_session</code> cookie. No JavaScript on our pages; plain forms only.","steps":[["Ask","GET any path — gets the login form back until logged in."],["Submit","POST the user name and phrase to /__wsb/login."],["Carry","Browser sends wsb_session automatically on later requests."]],"cond":[]},{"id":"CF","code":"T","name":"TLS terminator","short":"TUNNEL","group":"edge","gx":3.5,"gy":4.5,"w":2,"d":2,"h":40,"kind":"box","one":"Cloudflare Tunnel (or any TLS front) — the only road in.","what":"TLS is not web-safe-block's job. A tunnel or reverse proxy holds the certificate and forwards plain http to the public port, stamping the real client IP in a header.","how":"Forwards to <code>listen_addr</code> (default <code>127.0.0.1:8080</code>) and sets <code>CF-Connecting-IP</code>, which the gate trusts <mark>only when the TCP peer is loopback</mark> — i.e. cloudflared on the same machine — and the value parses as an IP; from any other peer the header is ignored and the peer address is used for client IP, rate limiting, and event logs.","steps":[["Terminate","TLS ends here; onward hop is plain http."],["Stamp","Adds CF-Connecting-IP with the real client address."],["Forward","Sends the request to listen_addr."]],"cond":[{"q":"If listen_addr is ever exposed directly, CF-Connecting-IP becomes attacker-controlled — should the gate only honor it from the tunnel's peer address?","r":"Yes, option A: the header is honored only from a loopback peer (127.0.0.0/8, ::1, IPv4-mapped loopback), with no new config setting; other peers are keyed on their own address, and serve warns at startup when listen_addr is not loopback. cloudflared must run on the same machine (2026-11-21)."}]},{"id":"G","code":"G","name":"The gate","short":"GATE","group":"gate","gx":7,"gy":3,"w":3,"d":2.5,"h":56,"kind":"gate","one":"The public listener: login page, session check, reserved endpoints, upgrade refusal, then forward-or-refuse.","what":"One port answers every request the internet sends. Without a valid session you get the phrase form and nothing else; with one, your request is handed to the forwarder — unless it asks for a protocol upgrade, which earns a 501. A tiny /__wsb/ namespace carries login, logout, and nothing else.","how":"<code>axum</code> router in <code>src/app.rs</code>: <code>GET|POST /__wsb/login</code> (GET just 303s to /; POST bodies capped at 4 KiB), <code>GET|POST /__wsb/logout</code> live in <code>src/auth.rs</code>, and <code>GET /robots.txt</code> — the gate's own <mark>Disallow: /</mark> for every agent, never forwarded, kind <code>robots</code> — live in <code>src/app.rs</code>, fallback <code>proxy_or_login</code> in <code>src/proxy.rs</code>. Every request first passes <code>validate_host</code> — exactly one well-formed <code>Host</code> header, matching an absolute-form URI if there is one — or gets <mark>400</mark>. Any path with a segment that decodes to <code>__wsb</code> (any case, percent-encoded, any position) is a 404 <mark>reserved</mark>. The root login page — a <code>front_page_message</code> paragraph above the form — is <mark>rendered once at startup</mark> (<code>AppState.root_page</code>); other paths render per request. The login form carries a sanitized <code>next</code> so a successful login returns you to what you asked for. Cross-site POSTs are refused via <code>Sec-Fetch-Site</code> (<code>same-origin</code>/<code>none</code> pass), then an <code>Origin</code> that must match Host — https when cookies are Secure. A POST with neither header is refused too. Phrase checks run on the blocking pool, <mark>one Argon2 hash at a time</mark> (<code>hash_slot</code>), and at most <mark>32 logins may queue</mark> for it — extras get 503, kind <code>login_busy</code>. Authenticated requests with an <code>Upgrade</code> header get <mark>501</mark>, kind <code>upgrade</code>. Every request exits through <code>record_event</code> middleware; gate pages are <code>no-store</code> and frame-denied.","steps":[["Route","/__wsb/ endpoints handled here; unknown ones are 404 reserved."],["Authenticate","Check every wsb_session cookie offered — first valid wins; expired ones drop lazily."],["Decide","Login page (401), the login/logout handlers, 501 for upgrade attempts, or hand to the forwarder."],["Report","Attach an Outcome; middleware pushes one event per request."]],"cond":[{"q":"Should GET /__wsb/logout end the session?","r":"No — GET shows a confirm form; only POST destroys the session, and cross-site POSTs are rejected (review-1 finding 5, fixed)."},{"q":"Cross-site POST checks fall back to Origin only when Sec-Fetch-Site is absent; a client sending neither is allowed through. Keep that posture?","r":"No, option B: fail closed — a POST to /__wsb/login or /__wsb/logout with neither Sec-Fetch-Site nor Origin gets 403 forbidden; every supported browser sends Origin on POST, and scripted clients must add one of the headers (2026-11-21)."},{"q":"A client that disconnects mid-login drops the hash_slot guard while its Argon2 run continues — rapid resets can stack many 12 MiB hashes in parallel and OOM the box. Move an owned guard inside the blocking task?","r":"Fixed — owned hash_slot (and session_writes) guards now move inside the blocking closures, so a cancelled request cannot release them early; at most 32 logins may queue for the slot, extras get 503 login_busy (review-4 finding 1, fixed)."},{"q":"A non-UTF-8 byte in any sibling cookie makes parse_cookies skip the whole Cookie header — a valid wsb_session is ignored (lockout loop) and logout then revokes nothing server-side. Parse cookies on raw bytes like strip_session_cookie does?","r":"Fixed — session_tokens parses Cookie headers on raw bytes, matching wsb_session by name and keeping only UTF-8 values (review-4 finding 3, fixed)."}]},{"id":"S","code":"S","name":"Session table","short":"SESSIONS","group":"gate","gx":6,"gy":7,"w":2,"d":2,"h":22,"kind":"store","one":"The gate's memory: hashed token → user + expiry, cached in RAM and persisted in users.db.","what":"A small table that answers \"who is this cookie?\" Login puts a random token in; every later request trades the cookie for a user name. A restart reloads the live sessions — nobody is logged out.","how":"<code>HashMap&lt;String, Session&gt;</code> behind a <code>Mutex</code>, write-through to the <code>sessions</code> table in <code>users.db</code>. Tokens are <mark>32 random bytes, hex</mark>; only their <mark>SHA-256 hash</mark> is stored — the raw token exists solely in the Set-Cookie header. Each session also gets a unique, increasing <code>created</code> stamp (unix µs, persisted) — when a cap is hit, expired entries drop first, then <mark>the earliest-created is evicted</mark>, so expiry changes can't reshuffle the order. On login the db write (insert + evictions, one transaction) lands <mark>before</mark> the map mutates; a failed save evicts nothing. Caps: 3 per user and 10,000 total. Every <code>wsb_session</code> cookie offered is checked — the first valid wins; expired ones drop lazily. The table is reloaded at startup and every 60s, dropping expired rows and picking up sessions deleted by <code>remove-user</code>.","steps":[["Insert","new_token() → hash → Session{user, expires, created}; plan evictions (earliest-created first); write rows to users.db, then mutate the map."],["Check","Each offered cookie → SHA-256 → lookup; valid + unexpired → user name."],["Reload","At startup and every 60s: delete expired rows, clear the map, refill from the table — also sees remove-user deletions."]],"cond":[{"q":"Sessions die on restart — acceptable while this guards one box, or should they persist?","r":"Persisted — write-through to the sessions table in users.db, hashes only, reload at startup and on the purge tick (ADR 0006, 2026-11)."},{"q":"A running serve notices remove-user deletions only on the 60s reload — is up to a minute of grace acceptable?","r":"Yes — up to 60s is accepted; restart serve after remove-user to drop the sessions immediately (2026-11-23)."},{"q":"A client that disconnects while a session write is in flight drops the session_writes guard but not the blocking db call — the table can commit a session the map never learns, or keep rows the write evicted, until the next reload. Move the owned guard and the map mutation inside the blocking task?","r":"Fixed — login, logout and the purger move the owned session_writes guard into the blocking closure, which also performs the map mutation on success (review-4 finding 1, fixed)."}]},{"id":"R","code":"R","name":"Failure ledger","short":"THROTTLE","group":"gate","gx":8.5,"gy":7,"w":2,"d":2,"h":22,"kind":"store","one":"Ten failed logins per quarter-hour per client — and each miss costs a second.","what":"The brute-force brake. Every failed login is written down against the client's IP; after ten in fifteen minutes the answer is \"too many attempts\" until the window slides past.","how":"<code>HashMap&lt;ip, Vec&lt;Instant&gt;&gt;</code>, keyed by client IP — <mark>IPv6 clients count per /64</mark> network, and an IPv4-mapped IPv6 address folds to plain IPv4. <mark>One attempt is reserved under a single lock</mark> before the database lookup, refunded on a db error and on success — a success only undoes its own reservation, so failures against other names keep counting. Over the limit the answer is <mark>429</mark> with the login page. Ledger bounded to 10,000 keys — when full, the key with the fewest in-window stamps (then oldest last failure) is evicted, so a throttled key keeps its budget. A wrong answer also waits 1s before responding.","steps":[["Reserve","Count this attempt under one lock; refuse if the key already has 10 in-window."],["Judge","Lookup miss → keep the stamp; db error or success → refund it."],["Delay","Failed logins sleep 1s before the 401."]],"cond":[{"q":"Limiting keys on client IP — visitors sharing one NAT or carrier-grade address share the 10/15min budget. Acceptable?","r":"Yes — a shared budget behind one NAT or carrier-grade address is accepted (2026-11-23)."},{"q":"Should failures count the attempt before the lookup (atomically)?","r":"Yes — reserve_attempt takes the slot under one lock, then refund/clear reconciles (review-1 finding 7, fixed)."},{"q":"Keyed on the full IP — an IPv6 client rotating host bits inside its /64 gets a fresh 10-attempt budget every request. Key IPv6 on the /64 prefix, or add a per-user-name throttle?","r":"IPv6 clients now rate-limit per /64 (rate_limit_key; IPv4-mapped IPv6 folds to plain IPv4) — deliberately no per-user-name throttle, which would let anyone lock a user out (review-4 finding 4, fixed)."}]},{"id":"U","code":"U","name":"Phrase book","short":"USERS.DB","group":"gate","gx":10,"gy":0.5,"w":2,"d":2,"h":22,"kind":"store","one":"The sqlite file of who may enter — salted phrase hashes only, never phrases.","what":"The list of people allowed in. It stores each user name, a random salt, the Argon2id hash of their normalized phrase, and an admin flag — not the phrase itself. The gate asks it \"does this name + phrase verify?\" on every login.","how":"<code>users.db</code>: <code>UserStore</code> opens it read-write for <code>serve</code> (it also writes the <code>sessions</code> table there — which carries a <code>created</code> stamp and cascades on user delete) and <code>list-users</code>; <code>add-user</code> creates and writes it — it reads all of stdin and hashes every phrase <mark>before</mark> opening one immediate transaction, so a running serve is never stalled, <code>remove-user NAME</code> deletes the user and their sessions in one transaction. It runs in <mark>WAL mode</mark> — users.db-wal/-shm are part of the database — for Litestream backups, with a 5s busy timeout. A db that predates the schema (users without <code>salt</code>, sessions without <code>created</code>) is <mark>refused, not migrated</mark>; new files are created mode 0600 and an over-exposed one earns a warning. Phrases are <mark>normalized — whitespace stripped, lower-cased</mark> — then hashed with <mark>Argon2id (12 MiB, t=3, p=1, 32-byte out) under a per-user salt</mark>, serialized so at most one hash runs at a time. Names are 1–64 printable ASCII, UNIQUE, and matched case-insensitively; a lookup for an unknown name still hashes against a dummy salt so timing does not reveal it. Names containing \"admin\" set the flag; new phrases need ≥20 non-whitespace chars, a digit, and punctuation.","steps":[["Normalize","Drop all whitespace, lower-case (\"Open Sesame\" == \"opensesame\")."],["Hash","Argon2id of the normalized phrase under a per-user salt — that hex is what is stored."],["Lookup","SELECT row WHERE user_name = ?1, then verify the Argon2id hash in constant time."],["Manage","add-user inserts; remove-user deletes the row and its sessions; list-users prints names + flags."]],"cond":[{"q":"There is no remove-user or phrase-rotation command — revoking someone means editing users.db by hand. Acceptable?","r":"remove-user NAME deletes the row — and now their sessions too (2026-11). A running serve drops those sessions on its next 60s reload; phrase rotation is still add-then-remove."},{"q":"The is_admin flag is stored and shown by list-users but serve never reads it for authorization — what should admins be able to do?","r":"Nothing for now — the flag is kept and listed but grants no extra rights; serve treats admins like any user (2026-11-23)."},{"q":"Why not a per-user salt on the hash?","r":"Done — the move to user name + phrase (commit c3f8099) gave a name to salt against: Argon2id with a random per-user salt replaced unsalted SHA-512 (ADR 0001 superseded)."},{"q":"add-user holds the WAL write lock across stdin reads and every Argon2 hash — a large batch stalls serve logins past the 5s busy timeout, and the deferred read-then-write can fail SQLITE_BUSY outright. Hash first, then insert in one immediate transaction?","r":"Fixed — all lines are validated and hashed with no transaction open (concurrent writers proceed), then a single BEGIN IMMEDIATE inserts the batch with ON CONFLICT DO NOTHING (review-4 finding 2, fixed)."}]},{"id":"F","code":"F","name":"Forwarder","short":"FORWARDER","group":"relay","gx":10.5,"gy":3,"w":2.5,"d":2,"h":44,"kind":"box","one":"Rewrites the request, scrubs it, sends it upstream, brings the answer back.","what":"Once you are known, this is the actual proxy. It points your request at the protected app, removes everything that could confuse or poison it — including the session cookie itself — and returns the app's answer.","how":"<code>hyper-util</code> client in <code>forward()</code> (<code>src/proxy.rs</code>), connecting over TCP or the configured unix socket (same 10s connect timeout). Swaps scheme+authority for <code>upstream</code>; strips <code>wsb_session</code>, hop-by-hop headers (a client <code>Connection</code> header can't remove Host or Content-Length), and <mark>all client-sent forwarding headers</mark> — every <code>X-Forwarded-*</code> plus a denylist (Forwarded, X-Real-IP, CF-Connecting-IP and the other CF client-IP headers, True-Client-IP, X-Client-IP, X-Cluster-Client-IP, Fastly-Client-IP, X-Original-Forwarded-For, Client-IP, X-Originating-IP, X-Remote-IP, X-Remote-Addr, X-Envoy-External-Address, X-URL-Scheme, Front-End-Https, X-Host, X-Original-Host) — CF-Connecting-IP is read for the client IP first but <mark>never forwarded</mark>; then stamps its own X-Forwarded-For (client IP), -Proto (https when cookies are Secure), -Host. 10s connect, 60s response-header deadline → 502/504, plus a 60s body-idle timeout (<code>IdleTimeoutBody</code>) that cuts off stalled streams. At most <mark>256 requests</mark> run upstream at once — extras get 503 — and the permit is held until the response body finishes — and a client that stops reading loses the connection (and the permit) after the 60s write-stall timeout in <code>src/server.rs</code>. Upstream Cache-Control is <mark>rewritten to private</mark> (public/s-maxage/proxy-revalidate and CDN override headers dropped) so a shared cache never serves a gated page; upstream Set-Cookie for wsb_session is dropped. Upgrade requests never reach here — the gate answers them 501.","steps":[["Rewrite","Keep path+query; replace scheme and authority with upstream."],["Scrub","Session cookie out; hop-by-hop out; client forwarding headers out."],["Stamp","Write X-Forwarded-For/-Proto/-Host from verified values."],["Send","10s connect timeout, 60s to response headers; else 502/504; cap 256 concurrent, else 503."],["Return","Strip hop-by-hop on the way back; drop any wsb_session Set-Cookie."]],"cond":[{"q":"Trust client-sent X-Forwarded-* / X-Real-IP headers?","r":"No — inbound forwarding headers are discarded and rebuilt from verified proxy metadata (review-1 finding 1, fixed)."},{"q":"Only connect (10s) and response-header (60s) deadlines exist — a response that stalls mid-body streams forever. Is that a real exposure?","r":"Fixed — a 60s body-idle timeout (IdleTimeoutBody) ends stalled streams, and a 256-permit semaphore bounds concurrent upstream requests (commit f5285b2)."},{"q":"The body-idle timer only runs while downstream polls frames — a slow-reading client can hold an upstream permit indefinitely. Idle the connection, not just the upstream read?","r":"Fixed — a custom accept loop (src/server.rs) wraps each connection in StallTimeoutIo: a write stalled 60s fails the connection, plus a 30s header-read timeout; a stalled client frees its permit (review-4 finding 5, fixed)."}]},{"id":"UP","code":"A","name":"Protected app","short":"UPSTREAM","group":"relay","gx":14,"gy":3,"w":3,"d":2.5,"h":18,"kind":"slab","one":"The web server being sheltered — bound to loopback or a unix socket, reachable only through the gate.","what":"Whatever app you are protecting: a blog, a dashboard, a thing that was never hardened. It sees only requests the gate already decided to allow, carrying honest forwarding headers.","how":"Any http server on <code>upstream</code> (default <code>http://127.0.0.1:3000</code>, http with no path — or <code>unix:/absolute/path.sock</code>, where <mark>file permissions</mark> keep other local processes out; a loopback TCP port cannot). It receives the visitor's <code>Host</code>, <code>X-Forwarded-For/Proto/Host</code> and never the <code>wsb_session</code> cookie.","steps":[["Serve","Handle the request as if the caller were already trusted."],["Respond","Answer streams back through the forwarder to the visitor."]],"cond":[{"q":"Upstream is http-on-loopback only — will a real deployment ever need https upstream or a unix socket?","r":"Unix socket: yes — upstream = \"unix:/absolute/path.sock\" (2026-11-23); socket permissions keep other local processes out. https upstream: not supported; use a sidecar (stunnel/socat) if the app is off-host."}]},{"id":"OP","code":"O","name":"Operator","short":"OPERATOR","group":"ops","gx":-1,"gy":1,"w":2,"d":2,"h":30,"kind":"screen","one":"The person with shell access who owns the box.","what":"You, on the machine itself: writing the config, adding users by piping lines, starting the server, and optionally tailing the monitor with netcat.","how":"Everything is one binary: <code>web-safe-block write-config | add-user | remove-user | list-users | serve</code>, plus <code>-c path</code> for a non-default <code>config.toml</code>. Watching is <code>nc 127.0.0.1 8081</code>.","steps":[["Configure","write-config emits a commented config.toml; refuses to overwrite."],["Populate","add-user reads \"name pass phrase…\" lines from stdin."],["Maintain","list-users shows names + admin flags; remove-user NAME deletes the user and their sessions."],["Run","serve binds the public port and the monitor port."],["Watch","nc to the monitor port for a live event stream."]],"cond":[]},{"id":"C","code":"C","name":"CLI & config","short":"CLI+CONFIG","group":"ops","gx":2,"gy":0.5,"w":2.5,"d":2,"h":30,"kind":"cards","one":"Five commands and one strict config file.","what":"The whole control surface. write-config lays down a commented config.toml; add-user, remove-user and list-users maintain the phrase book; serve runs everything. The config is all-or-nothing: every setting must be present and no unknown keys are allowed.","how":"<code>src/main.rs</code> + <code>src/settings.rs</code>. Eleven settings, <mark>all required, unknown keys denied</mark>: users_db, listen_addr (a literal IP:port), upstream, front_page_message, session_ttl_secs (1s–10y), cookie_secure, monitor_addr (loopback, or unix:/path created 0600), monitor_queue_len (≥1), max_header_size (1024–max_buf_size), max_buf_size (≥8192), max_connections (≥1). Relative users_db resolves against the config file's directory.","steps":[["write-config","Emit defaults with comments; refuse to overwrite an existing file."],["add-user","Per stdin line: first word = name, rest = phrase; weak or duplicate lines skipped; any skip fails the exit code."],["remove-user NAME","Deletes the row and its sessions in one transaction; errors if the name is not found."],["list-users","Print user_name + is_admin, sorted by name."],["serve","Load config + users.db (must exist, be current schema, and be non-empty), bind both ports."]],"cond":[{"q":"Single config file, no environment overrides or flags — fine for a small self-hosted tool, or will it annoy deployment?","r":"Fine — one strict config file, no env overrides or flags, stays the design (ADR 0004, 2026-11-23)."}]},{"id":"EQ","code":"Q","name":"Event queue","short":"EVENT QUEUE","group":"ops","gx":9.5,"gy":9.5,"w":2,"d":2,"h":18,"kind":"store","one":"A bounded ring of \"what just happened\" — handlers push without blocking.","what":"Every request — page shown, login won or lost, request proxied — becomes one small record. The queue holds the most recent ones until a monitor comes to read them; when it fills, the oldest are overwritten.","how":"<code>VecDeque&lt;Event&gt;</code> + <code>Condvar</code> in <code>src/monitor.rs</code>. Each event: <code>{seq, time, kind, status, ip, method, path, user?, user_agent?, truncated}</code> — the middleware caps fields (method 32 B, path 1 KiB — <mark>the query is never recorded</mark>, a trailing '?' only marks that one was present — UA 512 B) on char boundaries and sets <code>truncated</code>. The queue is bounded by count <mark>and ~4 MiB of retained bytes</mark>; overwrites of unsent events during a live connection are counted and later reported as <mark>{\"kind\":\"dropped\"}</mark>; events leave only after they are written to the client, at most 100 per write. Alongside the queue, <mark>per-UTC-day security counters</mark> (last 7 days, memory only) tally logins won/lost, unauthenticated non-root probes, rate-limited, login_busy, forbidden, reserved, other, login/logout errors — and events evicted while nobody is watching (<code>dropped_unseen</code>).","steps":[["Push","Stamp seq + UTC time; count the kind in today's counters; if full, evict the oldest (dropped notice if a monitor is attached, dropped_unseen if not)."],["Pending","Wait on the condvar; hand the batch out but keep it queued."],["Consume","ack(seq, dropped) only after the bytes hit the socket; unacked drops land in dropped_unseen on disconnect."]],"cond":[{"q":"Events overwritten while no monitor is connected vanish silently — should that count be surfaced to the next monitor?","r":"Yes — every eviction with no monitor attached is counted as dropped_unseen in in-memory per-UTC-day security counters (logins won/lost, unauthenticated non-root probes, rate-limited, login_busy, forbidden, reserved, other, login/logout errors); a new monitor first receives the last 7 days as daily_counts lines, and a connected monitor gets each day's final line at 00:00 UTC (2026-11-23)."}]},{"id":"MO","code":"M","name":"Monitor port","short":"MONITOR","group":"ops","gx":13,"gy":10,"w":2,"d":2,"h":26,"kind":"screen","one":"One loopback TCP client at a time gets the live JSON-lines feed.","what":"A peephole for the operator: connect with netcat and watch one JSON line per request scroll by. Only one watcher at a time; a second connection is told it is busy and hung up.","how":"Plain listener on <code>monitor_addr</code> (<mark>loopback enforced in config</mark>, or <code>unix:/absolute/path.sock</code> — bound inside a lock dir <code>.&lt;name&gt;</code> next to it (flock-held for the instance's life, so a second <code>serve</code> is refused before it can touch a live socket), chmod 0600, hard-linked into place no-clobber; a stale socket is replaced, a live one is refused, and a clean shutdown unlinks socket and lock dir) on its own OS thread; each client is served on a further thread, writes timing out at 30s and client input discarded. Second clients get <code>{\"error\":\"another monitor is already connected\"}</code> — <mark>never the counters</mark>. On connect the client first receives one <code>daily_counts</code> line per retained UTC day (up to 7, oldest first); while it stays connected, each day that ends at 00:00 UTC is pushed with <code>\"final\":true</code>. Once a client half-closes, a <code>heartbeat</code> line every 10s probes for gone-aways — a reset frees the slot.","steps":[["Accept","TCP or unix socket (created 0600 in its flock-held .<name> lock dir, hard-linked in); one slot: try_connect or send the busy error and close."],["Report","Write the retained days' daily_counts lines first."],["Stream","Wait for pending events; write JSON lines + dropped notices; a finished day's final counts go out at 00:00 UTC."],["Probe","After EOF on reads, heartbeat every 10s; a reset ends the connection."]],"cond":[{"q":"The monitor trusts loopback alone — any local process can watch the request stream. Is that fine, or should it take a token?","r":"Yes, by file permissions rather than a token — monitor_addr = \"unix:/absolute/path.sock\" is created 0600, so only the gate's own user can watch or hold the slot; TCP loopback stays allowed. Run the protected app as a separate OS user (README) (2026-11-23)."}]},{"id":"WS","code":"W","name":"WebSocket relay","short":"WEBSOCKETS","group":"off","ghost":true,"gx":17,"gy":5.5,"w":2,"d":2,"h":34,"kind":"box","one":"Designed for, not built: live upgrade connections to the app.","what":"Apps that want WebSockets cannot work through the gate today — an authenticated request carrying an Upgrade header is answered 501 and never reaches the app.","how":"<code>proxy_or_login</code> returns <mark>501 Not Implemented</mark>, kind <code>upgrade</code>, for any authenticated request with an <code>Upgrade</code> header; the hop-by-hop scrub still removes <code>connection</code>/<code>upgrade</code> from ordinary traffic. A real relay needs an upgrade path in <code>forward()</code> and a decision about streaming bodies.","steps":[["Upgrade","Detect a genuine upgrade request after the session check."],["Relay","Pipe the connection to upstream instead of request/response."]],"cond":[{"q":"Until then: should v1 answer upgrade attempts with a clear 501 instead of forwarding a stripped request that fails mysteriously?","r":"Yes — the gate answers 501 (kind upgrade) to authenticated Upgrade requests and forwards nothing (2026-11-17)."}]}];

const CH = [{"id":"door","title":"The front door","reveal":["BR","CF","G"],"lede":"Every request arrives at one public port; everything else hides behind it.","story":"<p>web-safe-block sits between the internet and a web server you don't fully trust. The <mark>tunnel terminates TLS</mark> and stamps the real client IP; the gate answers every request itself until a phrase is proved.</p>","flow":[["BR","CF","GET /",{"method":"GET","path":"/"}],["CF","G","http + CF-Connecting-IP",{"headers":{"cf-connecting-ip":"203.0.113.9"}}],["G","CF","401 login page",{"status":401,"kind":"login_page"}],["CF","BR","https response",{"status":401,"body":"phrase form"}]]},{"id":"phrase","title":"The phrase book","reveal":["U"],"lede":"A name and a secret per person: the phrase proves you, the name says who.","story":"<p>The login form asks for a user name and a pass phrase. The phrase is <mark>normalized — whitespace stripped, lower-cased</mark> — then Argon2id'd under the user's own salt and compared in constant time; the database never stores the phrase itself. An unknown name still costs one hash against a dummy salt.</p>","flow":[["BR","G","POST name + phrase (via tunnel)",{"form":{"user":"chris","phrase":"correct horse … 42!"}}],["G","U","SELECT by user_name + Argon2id verify",{"user_name":"chris"}],["U","G","user row",{"user_name":"chris","is_admin":false}],["G","BR","303 + Set-Cookie",{"set_cookie":"wsb_session=…"}]]},{"id":"session","title":"The session table","reveal":["S"],"lede":"A correct phrase mints a token; the cookie is your ticket from then on.","story":"<p>The gate keeps a <mark>small table — hashed token → user + expiry + created stamp</mark> — capped at 3 sessions per user and 10,000 total, earliest-created evicted. Every login writes through to the <code>sessions</code> table in users.db (SHA-256 of the token only) <mark>before</mark> the in-memory map changes, and serve reloads the table at startup and every minute — restart no longer logs anyone out.</p>","flow":[["BR","G","POST name + phrase",{"form":{"user":"chris","phrase":"…"}}],["G","S","insert hash",{"cookie_string":"sha256(9f3a…)","user":"chris","created":"<unix µs>","ttl_secs":15552000}],["G","BR","303 + Set-Cookie",{"set_cookie":"wsb_session=9f3a…"}],["BR","G","next request + cookie",{"cookie":"wsb_session=9f3a…"}],["G","S","lookup",{"token":"9f3a…"}],["S","G","user + expiry",{"user":"chris","ok":true}]]},{"id":"through","title":"Through to the app","reveal":["F","UP"],"lede":"Once you're known, the gate rewrites and forwards — the app never sees the login dance.","story":"<p>The forwarder <mark>rebuilds the request</mark>: the session cookie and hop-by-hop headers come out, client-sent forwarding headers are discarded, honest ones are stamped. The answer's Cache-Control is <mark>rewritten to private</mark> so a shared cache can't serve it to someone else. The app sits on loopback and trusts what arrives.</p>","flow":[["BR","G","GET /app + cookie",{"cookie":"wsb_session=9f3a…"}],["G","S","check",{"token":"9f3a…"}],["S","G","ok: chris",{"user":"chris"}],["G","F","forward",{"note":"scrubbed + stamped"}],["F","UP","GET /app",{"headers":{"x-forwarded-for":"203.0.113.9"}}],["UP","F","200",{"status":200}],["F","G","response",{"status":200}],["G","BR","response via tunnel",{"status":200}]]},{"id":"throttle","title":"Slowing down guessing","reveal":["R"],"lede":"Wrong phrase? Ten tries per quarter-hour per client — and each miss costs a second.","story":"<p>Failures are counted per <mark>client IP</mark> (the tunnel's header when the connection comes from the tunnel on loopback, otherwise the peer address) in a bounded ledger. The attempt is reserved before the lookup, so concurrency can't slip extra tries through.</p>","flow":[["BR","G","POST wrong phrase",{"form":{"user":"chris","phrase":"let me in"}}],["G","R","reserve attempt",{"key":"203.0.113.9"}],["R","G","under limit",{"in_window":"n/10"}],["G","U","SELECT by user_name + Argon2id verify",{"user_name":"chris"}],["U","G","miss",{"found":false}],["G","BR","401 after 1s",{"kind":"login_failed"}]]},{"id":"watch","title":"Watching the door","reveal":["EQ","MO"],"lede":"Every request leaves a one-line trace on a loopback port.","story":"<p>Handlers <mark>push events without blocking</mark> into a queue bounded by count and ~4 MiB; a separate thread serves them as JSON lines to one connected monitor, marking them consumed only after the bytes are written.</p>","flow":[["BR","G","any request",{"method":"POST","path":"/__wsb/login"}],["G","EQ","push event",{"kind":"login_succeeded","ip":"203.0.113.9"}],["EQ","MO","JSON line",{"seq":4}],["MO","EQ","mark consumed",{"up_to":4}]]},{"id":"operate","title":"Running it","reveal":["OP","C"],"lede":"Five commands: write-config, add-user, remove-user, list-users, serve.","story":"<p>The operator <mark>manages users by piping lines</mark> — \"name pass phrase words…\" — into add-user; remove-user deletes the user and their sessions, and list-users shows who is in. serve refuses to start with no users at all.</p>","flow":[["OP","C","add-user <<EOF",{"line":"chris correct horse … 42!"}],["C","U","INSERT hash",{"user_name":"chris","salt":"<16B hex>","pass_phrase":"<argon2id hex>","is_admin":false}],["OP","C","remove-user carol",{"arg":"carol"}],["C","U","DELETE row",{"changes":1}],["OP","MO","nc 127.0.0.1:8081",{"connect":"monitor stream"}]]},{"id":"later","title":"Not switched on","reveal":["WS"],"lede":"Designed for, not built.","story":"<p>One sketch sits on the map as a <mark>dashed ghost</mark>: a WebSocket relay — today the gate answers upgrade attempts 501. (Saved sessions were built: see the session table and ADR 0006.)</p>","flow":[["BR","G","GET /ws + Upgrade",{"headers":{"upgrade":"websocket","cookie":"wsb_session=9f3a…"}}],["G","S","session check",{"token":"9f3a…"}],["S","G","ok: chris",{"user":"chris"}],["G","BR","501 Not Implemented",{"status":501,"kind":"upgrade"}]]},{"id":"all","title":"The whole system","reveal":[],"lede":"Everythin const HOW_HTML = "<div class=\"eyebrow\">web-safe-block · v0.1</div><h1 class=\"t\">How it's built</h1><div class=\"sub\">a small Rust gate in front of a softer app</div>\n<h3 class=\"sec\">Filesystem</h3><pre>web-safe-block/\n  src/\n    main.rs       write-config · add-user · remove-user · list-users · serve\n    lib.rs        crate root: module wiring + re-exports\n    app.rs        router, event middleware, purger\n    auth.rs       login/logout handlers\n    proxy.rs      session check, 501 on upgrade, forwarder\n    sessions.rs   session table ops + token minting\n    rate_limit.rs per-IP failure ledger ops\n    state.rs      Config · Limits · AppState\n    util.rs       cookie/header/HTML helpers\n    users.rs      users.db schema (users + sessions) + phrase policy\n    monitor.rs    EventQueue + monitor thread\n    settings.rs   strict config.toml\n  tests/proxy.rs  end-to-end against a real upstream\n  Notes/atlas/    this atlas</pre>\n<h3 class=\"sec\">Runtime shape</h3><pre>one process\n  tokio runtime ─ public listener (axum + hyper)\n                ├ purger task (session reload + failures, 60s)\n                └ hash_slot: one Argon2 (~12 MiB) at a time, on the blocking pool\n  OS thread     ─ monitor listener + per-client threads\n  hyper client  ─ upstream, 10s connect / 60s headers / 60s body-idle · ≤256 live</pre>\n<h3 class=\"sec\">Ports</h3><pre>listen_addr   127.0.0.1:8080  public (via tunnel)\nmonitor_addr  127.0.0.1:8081  loopback or unix socket (0600)\nupstream      127.0.0.1:3000  the protected app</pre>";
const DECISIONS_HTML = "<li><b>Runtime.</b> Rust + axum/hyper on one tokio runtime; a plain OS thread runs the monitor</li><li><b>Credential.</b> User name + pass phrase; names are 1–64 printable ASCII, matched case-insensitively</li><li><b>Phrase storage.</b> Per-user salted Argon2id (12 MiB, t=3, p=1, 32-byte out) of the normalized phrase, looked up by user name — unknown names still cost one hash against a dummy salt; ≥20 chars + digit + punctuation enforced at add time</li><li><b>Sessions.</b> Write-through to a sessions table in users.db (SHA-256 of the token only), in-memory map as cache, 3/user and 10k total with earliest-created evicted; the db write lands before the map mutates; reload at startup and on the 60s purge tick picks up remove-user</li><li><b>Hash work.</b> Argon2 runs are serialized through hash_slot on the blocking pool — at most one ~12 MiB hash at a time</li><li><b>Client IP.</b> CF-Connecting-IP is trusted only from a loopback peer (cloudflared on the same box) and when it parses as an IP; any other peer is keyed on its own address. Duplicate CF-Connecting-IP values fail closed to the peer; IPv6 values are canonicalized. serve warns if listen_addr is not loopback</li><li><b>Config.</b> Every setting required; unknown keys rejected; relative users_db resolves against the config file; session_ttl_secs bounded to 1s–10y</li><li><b>Monitor.</b> One loopback or unix-socket (0600) JSON-lines client at a time; queue bounded by count and ~4 MiB, oldest overwritten</li><li><b>Upstream.</b> http:// (no path) or unix:/absolute/path socket — the protected app stays on the same machine</li><li><b>Reserved paths.</b> any path segment that percent-decodes to __wsb (any case, any position) is never forwarded; cross-site POSTs to /__wsb/ endpoints are rejected</li><li><b>Crawlers.</b> /robots.txt is answered by the gate with Disallow: / for every agent and never forwarded</li><li><b>Shared caches.</b> Upstream Cache-Control is rewritten to private (public/s-maxage/proxy-revalidate and CDN override headers dropped) — a shared cache must never serve a gated page</li><li><b>Protocol upgrades.</b> An Upgrade header gets 501 after the session check — never proxied (a real WS relay is still a ghost)</li>";

/* ---------------- CHAPTERS (progressive disclosure) ---------------- */
/* ---------------- ISO ---------------- */
const TW=72, TH=36;
function P(gx,gy,z=0){ return [(gx-gy)*TW/2, (gx+gy)*TH/2 - z]; }
function pts(a){ return a.map(p=>p.join(',')).join(' '); }
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));

const NS='http://www.w3.org/2000/svg';

/* ---------------- STATE ---------------- */
const S = { ch:0, view:'world', inside:null, selected:null, hover:null, tab:'what', playing:true, tx:0, ty:0, k:1, packets:[], selPacket:null, flowSel:(typeof FLOWS!=='undefined'&&FLOWS[0]?FLOWS[0].id:'turn'), maxCh:0 };

/* ---------------- SCENES ---------------- */
function buildWorldScene(){
  const ids=new Set(revealedIds()); sceneNodes=NODES.filter(n=>ids.has(n.id)); sceneHops=[];
  const c=CH[S.ch];
  if(c.flow){ c.flow.forEach((h,i)=>{ let bend=bendFor(h[0],h[1]); const rev=c.flow.findIndex(x=>x[0]===h[1]&&x[1]===h[0]); if(rev>-1&&rev<i) bend=bend==='xy'?'yx':'xy'; sceneHops.push({flow:'ch',idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend}); }); }
  else { FLOWS.forEach(f=>{ if(S.flowSel!=='both'&&f.id!==S.flowSel)return; f.hops.forEach((h,i)=>sceneHops.push({flow:f.id,idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend:h[4]||'xy'})); }); }
}
function bendFor(a,b){ const t=FLOWS.flatMap(f=>f.hops||[]).find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }
function buildInsideScene(n){
  const steps=n.steps||[]; sceneNodes=steps.map((s,i)=>({id:'s'+i,code:String(i+1),name:s[0],short:s[0],desc:s[1],gx:2+i*3.4,gy:2+i*0.6,w:2,d:2,h:34,inside:true}));
  sceneHops=[]; for(let i=0;i<steps.length-1;i++) sceneHops.push({flow:'inside',idx:i,from:'s'+i,to:'s'+(i+1),label:steps[i][0]+' → '+steps[i+1][0],payload:{step:i+1,handsOff:steps[i+1][0]},bend:'xy'});
}
function hopPath(h){
  const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); if(!A||!B) return null;
  const [ax,ay]=center(A), [bx,by]=center(B); const mid = h.bend==='xy' ? [bx,ay] : [ax,by];
  const g=[[ax,ay],mid,[bx,by]].filter((p,i,arr)=>i===0||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
  const scr=g.map(p=>P(p[0],p[1],0)); let len=0; const seg=[]; for(let i=1;i<scr.length;i++){const l=Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]);seg.push(l);len+=l;}

}
function pointAt(path,t){ let d=t*path.len; for(let i=0;i<path.seg.length;i++){ if(d<=path.seg[i]||i===path.seg.length-1){const u=path.seg[i]?Math.min(1,d/path.seg[i]):1;const a=path.scr[i],b=path.scr[i+1];return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];} d-=path.seg[i]; } return path.scr[0]; }

/* ---------------- RENDER ---------------- */

}

function drawNode(n){

/* ---------------- PACKETS ---------------- */
function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
function drawPackets(){
  const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
  S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
    const isSel=S.selPacket===i; const g=el('g',{class:'pkt'+(isSel||S.ch<CH.length-1?' lbl-on':''),style:'cursor:pointer','data-i':i});
    if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
    const lg=el('g',{class:'lbl'}); const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label;
    lg.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); lg.appendChild(lbl); g.appendChild(lg);
    pg.appendChild(g);
  });
}
let last=0;
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
requestAnimationFrame(tick);

/* ---------------- PANEL ---------------- */
function nodeChip(id){ const n=byId[id]; return `<button class="chip${n.ghost?' ghost':''}" onclick="select('${id}')">${esc(n.code)} · ${esc(n.name)}</button>`; }
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.selPacket!=null && S.packets[S.selPacket]){ const p=S.packets[S.selPacket]; const hs=hopsOf(p.flow); const h=hs[p.hop];
    const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); const flowName=p.flow==='ch'?CH[S.ch].title:p.flow==='inside'?'inside '+byId[S.inside].name:(FLOWS.find(f=>f.id===p.flow)||{}).name;
    body.innerHTML=`<div class="eyebrow">Data packet · ${esc(flowName)} · hop ${p.hop+1} of ${hs.length}</div><h1 class="t">${esc(h.label)}</h1>
    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
/* Selection runs on pointerdown rather than click. render() and drawPackets() each
   clear their layer, and both run on hover, so the box or dot under the cursor is
   replaced between press and release — the browser then never synthesises a click on
   it and click-to-pin silently did nothing. Pointer capture is deferred until a drag
   actually starts for the same reason: capturing on pointerdown retargets the click
   to the svg, away from the node. */
function selectPacket(i){ S.selPacket=i; S.playing=false; syncFlowBtn(); renderPanel(); drawPackets(); }
let drag=null, lastTap={id:null,t:0};
svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null;
  const hit=e.target.closest?e.target.closest('g.node,g.pkt'):null, isPkt=hit&&hit.classList.contains('pkt');
  drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false,pid:e.pointerId,
    pkt:isPkt?+hit.dataset.i:null, id:hit&&!isPkt?hit.dataset.id:null}; });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){ if(Math.hypot(dx,dy)<=3)return; drag.moved=true; svg.classList.add('dragging'); try{svg.setPointerCapture(drag.pid);}catch(_){} }
  S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointercancel',()=>{ drag=null; svg.classList.remove('dragging'); });
svg.addEventListener('pointerup',()=>{ const d=drag; drag=null; svg.classList.remove('dragging');
  if(!d||d.moved)return;                                  // a pan, not a tap — leave selection alone
  if(d.pkt!=null){ selectPacket(d.pkt); return; }
  if(d.id==null){ select(null); return; }                 // empty canvas clears the pin
  const n=sceneNodes.find(x=>x.id===d.id), now=performance.now();
  if(lastTap.id===d.id&&now-lastTap.t<400){ lastTap={id:null,t:0}; if(n&&!n.inside&&n.steps){ goInside(d.id); return; } }
  else lastTap={id:d.id,t:now};
  select(d.id); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
